<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <h1>🌐 Language Translator</h1>
        <p class="subtitle">Translate text instantly across languages</p>

        <div class="card">
            <div class="lang-row">
                <div class="lang-group">
                    <label>Source Language</label>
                    <select id="sourceLang">
                        {% for code, name in languages.items() %}
                            <option value="{{ code }}" {% if code == 'auto' %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="swap-btn" onclick="swapLanguages()" title="Swap languages">⇄</button>

                <div class="lang-group">
                    <label>Target Language</label>
                    <select id="targetLang">
                        {% for code, name in languages.items() %}
                            {% if code != 'auto' %}
                                <option value="{{ code }}" {% if code == 'hi' %}selected{% endif %}>{{ name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="text-row">
                <div class="text-group">
                    <label>Input Text</label>
                    <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
                    <span class="char-count" id="charCount">0 characters</span>
                </div>
                <div class="text-group">
                    <label>Translated Text</label>
                    <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
                    <button class="copy-btn" onclick="copyText()" id="copyBtn">📋 Copy</button>
                </div>
            </div>

            <button class="translate-btn" onclick="translateText()">Translate ➜</button>
            <p id="errorMsg" class="error"></p>
        </div>
    </div>

    <script>
        document.getElementById("inputText").addEventListener("input", function () {
            document.getElementById("charCount").textContent = this.value.length + " characters";
        });

        async function translateText() {
            const text = document.getElementById("inputText").value.trim();
            const source = document.getElementById("sourceLang").value;
            const target = document.getElementById("targetLang").value;
            const errorMsg = document.getElementById("errorMsg");
            const outputText = document.getElementById("outputText");

            errorMsg.textContent = "";
            if (!text) {
                errorMsg.textContent = "Please enter some text first.";
                return;
            }

            outputText.value = "Translating...";

            const response = await fetch("/translate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, source, target }),
            });

            const data = await response.json();
            if (data.error) {
                errorMsg.textContent = data.error;
                outputText.value = "";
            } else {
                outputText.value = data.translated_text;
            }
        }

        function copyText() {
            const output = document.getElementById("outputText").value;
            if (!output) return;
            navigator.clipboard.writeText(output);
            const btn = document.getElementById("copyBtn");
            btn.textContent = "✅ Copied!";
            setTimeout(() => btn.textContent = "📋 Copy", 2000);
        }

        function swapLanguages() {
            const src = document.getElementById("sourceLang");
            const tgt = document.getElementById("targetLang");
            const inputText = document.getElementById("inputText");
            const outputText = document.getElementById("outputText");

            const tempVal = src.value;
            src.value = tgt.value;
            tgt.value = tempVal === "auto" ? "en" : tempVal;

            const tempText = inputText.value;
            inputText.value = outputText.value;
            outputText.value = tempText;
        }
    </script>
</body>
</html>
